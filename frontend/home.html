<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="common.css">
</head>

<body>
    <h1>Students</h1>

    <section id="addstudentsection">
        <form id="addstudentform">
            <label for="studentname">Student Name </label>
            <input type="text" id="studentnameinput">
            <label for="studentage">Student Age </label>
            <input type="number" id="studentageinput">
            <button type="submit" id="studentcreatebutton">Submit </button>
        </form>
    </section>


    <div id="student-table-div">
        <table id="studenttable">
            <thead>
                <tr>
                    <td>ID </td>
                    <td>Name </td>
                    <td>Age </td>

                </tr>
            </thead>
            <tbody id="studenttablebody">
                <!--dynamic code -->
            </tbody>
        </table>
    </div>

    <script>

        const path = window.location.origin;
        console.log(`PATH is  ${path}`);

        async function getStudents() {

            let rows = "";
            let studentTableBody = document.getElementById("studenttablebody");

            const response = await fetch("http://localhost:8081/students/allstudents")
            if (!response.ok) {
                console.error("fetch error");
                return;
            }
            const data = await response.json();

            data.forEach(student =>

                rows += `<tr><td> ${student.id} </td> <td> ${student.name} </td> <td> ${student.age} </td> </tr>`


            )
            studentTableBody.innerHTML = rows;
        }

        document.getElementById("studentcreatebutton").addEventListener("click", async (e) => {
            e.preventDefault();
            console.log("prevented");
            let nameInput = document.getElementById("studentnameinput").value;
            let ageInput = parseInt(document.getElementById("studentageinput").value);

            const response = await fetch("http://localhost:8081/students/addstudent", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ name: nameInput, age: ageInput })
            })
            if (!response.ok) {
                console.error("ERror fetch");
                return;
            }
            const data = response.json();
            alert("CREATED");

            document.getElementById("studentnameinput").value = "";
            document.getElementById("studentageinput").value = "";
            await getStudents();




        })

        getStudents();
    </script>

</body>

</html>
